models:
  - name: fct_jaffle_shop__orders
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: number(38,0)
        constraints:
          - type: not_null
      - name: customer_id
        data_type: number(38,0)
      - name: order_placed_at
        data_type: date
      - name: amount
        data_type: number(28,2)
        data_tests:
          - average_dollars_spent_greater_than_one:
              arguments:
                group_by_column: customer_id